networks:
  slordefweb-dev:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slordef
      POSTGRES_PASSWORD: slordef
      POSTGRES_DB: slordef
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - slordefweb-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slordef -d slordef"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      TZ: UTC
      PORT: 3333
      HOST: 0.0.0.0
      LOG_LEVEL: info
      APP_KEY: dev-secret-key-minimum-32-characters-long
      NODE_ENV: development
      SESSION_DRIVER: cookie
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: slordef
      POSTGRES_PASSWORD: slordef
      POSTGRES_DB: slordef
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - slordefweb-dev

volumes:
  postgres_data:
